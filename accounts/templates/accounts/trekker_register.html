{% extends 'base.html' %} {% load static %} {% block title %}Trekker
Registration{% endblock %} {% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}" />
{% endblock %} {% block content %}

<section class="auth-section">
  <div class="auth-card">
    <h1>Join Trek Sathi</h1>

    <p class="subtitle">Discover Nepal, One Trek at a Time.</p>

    <form method="POST">
      {% csrf_token %}

      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input
          type="text"
          name="full_name"
          placeholder="Full Name"
          value="{{ full_name|default:'' }}"
          required
        />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-user-tag"></i>
        <input
          type="text"
          name="username"
          placeholder="Username"
          value="{{ username|default:'' }}"
          required
        />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input
          type="email"
          name="email"
          placeholder="Email Address"
          value="{{ email|default:'' }}"
          required
        />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input
          type="tel"
          name="phone"
          placeholder="Phone Number"
          value="{{ phone|default:'' }}"
          inputmode="tel"
          pattern="\+?[0-9]+"
          maxlength="14"
          oninput="this.value = this.value.replace(/[^0-9+]/g, '')"
        />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input
          type="password"
          name="confirm_password"
          placeholder="Confirm Password"
          required
        />
      </div>
      <button type="submit" class="auth-btn">Create Account</button>
    </form>
    <p class="bottom-text">
      Already have an account?
      <a href="{% url 'login_choice' %}">Login</a>
    </p>
  </div>
</section>

{% endblock %}
