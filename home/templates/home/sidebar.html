<aside class="dashboard-sidebar">
  <div class="profile-box">
    <div class="profile-avatar">
      <i class="fa-solid fa-user"></i>
    </div>

    <h3>{{ request.user.username }}</h3>

    <span>Trekker</span>
  </div>

  <nav class="dashboard-nav">
    <a
      href="{% url 'trekker_dashboard' %}"
      class="{%if request.resolver_match.url_name == 'trekker_dashboard'%}active{% endif %}"
    >
      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>
    </a>
    <a
      href="{% url 'profile' %}"
      class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}"
    >
      <i class="fa-solid fa-user"></i>
      <span>My Profile</span>
    </a>
    <a
      href="{% url 'my_bookings' %}"
      class="{% if request.resolver_match.url_name == 'my_bookings' %}active{% endif %}"
    >
      <i class="fa-solid fa-calendar-check"></i>
      <span>My Bookings</span>
    </a>

    <a
      href="{% url 'saved_packages' %}"
      class="{% if request.resolver_match.url_name == 'saved_packages' %}active{% endif %}"
    >
      <i class="fa-solid fa-heart"></i>
      <span>Saved Packages</span>
    </a>
    <a href="{% url 'my_conversations' %}"
    class="{% if request.resolver_match.url_name == 'my_conversations' %}active{% endif %}">
        <i class="fa-solid fa-comments"></i>
      <span> My Enquiries</span>
    </a>
  </nav>

  <div class="logout-btn">
    <a href="{% url 'logout' %}">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Logout</span>
    </a>
  </div>
</aside>
